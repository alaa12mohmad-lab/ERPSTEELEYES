<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- سياسة أمان المتصفح: الصفحة ما تحمّلش ولا تبعت لأي مكان غير الموقع نفسه وSupabase.
       لو اتعدّل السكربت اللي تحت (الثيم) لازم الـ sha256 يتحسب من جديد -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-Vc/8EQD1dySHoENeFyJHGTOR5wAdS6QTpXJEwvyqHao='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; frame-src 'self' blob: https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#1f2a37">
  <title>النظام الموحد</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // تطبيق الثيم قبل الرسم (بدون وميض)
    try {
      var t = JSON.parse(localStorage.getItem('erp-theme') || '{}');
      var dark = t.mode === 'dark' || (t.mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.accent = t.accent || 'iron';
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/styles.css?v=0.9.1">
  <script src="vendor/supabase.js"></script>
  <script src="vendor/xlsx.full.min.js" defer></script>
</head>
<body>
  <div id="app"><div class="boot">جارٍ التحميل…</div></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js?v=0.9.1"></script>
</body>
</html>
